
<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spitaweb | Infraestructura + IA para Clínicas Privadas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind is compiled via PostCSS (no CDN in production) -->
    <style>
      :root {
        --brand-cyan: #06b6d4;
        --brand-blue: #2563eb;
        --brand-cyan-glow: rgba(6, 182, 212, 0.4);
        --brand-blue-glow: rgba(37, 99, 235, 0.3);
        --bg-dark: #020617;
        --text-main: #f8fafc;
        --ease-premium: cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Montserrat', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Grain Overlay */
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.035;
        z-index: 9999;
        pointer-events: none;
      }

      .text-gradient {
        background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .glass {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .reveal { opacity: 0; transform: translateY(40px); transition: all 1s var(--ease-premium); }
      .reveal.active { opacity: 1; transform: translateY(0); }

      .btn-secondary {
        background: linear-gradient(135deg, var(--brand-cyan), var(--brand-blue));
        padding: 1.25rem 2.5rem; border-radius: 1.25rem; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.4s var(--ease-premium);
      }
      .btn-secondary:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px var(--brand-cyan-glow); }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
    <!-- Vite bundles dependencies; no importmap needed -->
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
